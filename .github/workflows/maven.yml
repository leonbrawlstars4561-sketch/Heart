name: Build HeartsPlugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build HeartsPlugin
        working-directory: HeartsPlugin
        run: mvn clean package

      - name: Show target files
        run: ls -la HeartsPlugin/target

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: HeartsPlugin
          path: HeartsPlugin/target/*.jar
          if-no-files-found: error
